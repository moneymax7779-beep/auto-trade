name: autotrade

# Local development stack. Everything binds to loopback only.
#   docker compose up -d                   -> PostgreSQL/TimescaleDB only
#   docker compose --profile platform up -d -> adds Valkey and Keycloak (needed from Phase 3/5)

services:
  postgres:
    image: timescale/timescaledb:2.30.1-pg17
    container_name: autotrade-postgres
    environment:
      POSTGRES_DB: autotrade
      POSTGRES_USER: autotrade
      POSTGRES_PASSWORD: ${AUTOTRADE_DB_PASSWORD:-autotrade}
      # Skip timescaledb-tune's memory guess; settings are explicit below.
      NO_TS_TUNE: "true"
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=4GB
      - -c
      - timescaledb.telemetry_level=off
    ports:
      - "127.0.0.1:5500:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 512m
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotrade -d autotrade"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: autotrade-valkey
    profiles: [platform]
    ports:
      - "127.0.0.1:6390:6379"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: autotrade-keycloak
    profiles: [platform]
    command: ["start-dev", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:8180:8180"
    restart: unless-stopped

volumes:
  pgdata:
    name: autotrade-pgdata
