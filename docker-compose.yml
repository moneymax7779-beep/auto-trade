name: autotrade

# auto-trade stack. Everything binds to loopback only.
#   bin/deploy                              -> build and (re)start trading-core with its database
#   docker compose up -d                    -> PostgreSQL/TimescaleDB and trading-core
#   docker compose --profile platform up -d -> adds Valkey and Keycloak (Phase 5)

services:
  postgres:
    image: timescale/timescaledb:2.30.1-pg17
    container_name: autotrade-postgres
    environment:
      POSTGRES_DB: autotrade
      POSTGRES_USER: autotrade
      POSTGRES_PASSWORD: ${AUTOTRADE_DB_PASSWORD:-autotrade}
      # Skip timescaledb-tune's memory guess; settings are explicit below.
      NO_TS_TUNE: "true"
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=1GB             # was 4GB: replay batches filled it and it stayed allocated (2026-09-29)
      - -c
      - timescaledb.telemetry_level=off
    ports:
      - "127.0.0.1:5500:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 512m
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotrade -d autotrade"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The PAPER trading service, always on. It serves the UI and starts the live session itself at
  # 09:00 IST on trading days (--mode=auto); Docker restarts it and starts it whenever Docker starts.
  trading-core:
    build:
      context: .
      dockerfile: app-trading-core/Dockerfile
      args:
        CODE_VERSION: ${AUTOTRADE_CODE_VERSION:-dev}
    image: autotrade-trading-core:${AUTOTRADE_CODE_VERSION:-latest}
    container_name: autotrade-trading-core
    command: ["--mode=auto"]
    environment:
      AUTOTRADE_DB_URL: jdbc:postgresql://postgres:5432/autotrade
      AUTOTRADE_DB_PASSWORD: ${AUTOTRADE_DB_PASSWORD:-autotrade}
      # zt-tiger-v2's database on this machine's loopback, read-only; its password file is mounted below.
      ZT_SOURCE_URL: jdbc:postgresql://host.docker.internal:5490/trading
      ZT_SOURCE_PASSWORD_FILE: /run/zt/runtime.env
      UPSTOX_TOKEN_FILE: /app/.local/upstox/token.json
      SERVER_ADDRESS: 0.0.0.0        # inside the container; the published port below is loopback-only
      # Per-user logins: none (default, as before) or oidc with Keycloak (bin/keycloak/bootstrap.sh)
      AUTOTRADE_AUTH_MODE: ${AUTOTRADE_AUTH_MODE:-none}
      AUTOTRADE_AUTH_PUBLIC_BASE: ${AUTOTRADE_AUTH_PUBLIC_BASE:-}
      AUTOTRADE_AUTH_INTERNAL_BASE: ${AUTOTRADE_AUTH_INTERNAL_BASE:-http://keycloak:8180/auth}
      AUTOTRADE_AUTH_CLIENT_SECRET: ${AUTOTRADE_AUTH_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8095:8095"
    volumes:
      - ./config:/app/config:ro
      - ./.local:/app/.local
      - ../zt-tiger-v2/.local/v2/runtime.env:/run/zt/runtime.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 3g
    restart: unless-stopped

  # Live execution: the execution workers. Opt-in only (docker compose --profile execution up -d execution);
  # PAPER and DRY_RUN followers (a ZERODHA DRY_RUN account on follower-risk v3 trades through the Kite adapter against
  # a local simulator inside the container); LIVE refused. No market-data connection; never migrates the schema.
  # AUTOTRADE_EXECUTION_COPY_GROUP: one copy group, a comma list, or * (every enabled group of every tenant).
  execution:
    profiles: ["execution"]
    build:
      context: .
      dockerfile: app-execution/Dockerfile
      args:
        CODE_VERSION: ${AUTOTRADE_CODE_VERSION:-dev}
    image: autotrade-execution:${AUTOTRADE_CODE_VERSION:-latest}
    container_name: autotrade-execution
    environment:
      AUTOTRADE_DB_URL: jdbc:postgresql://postgres:5432/autotrade
      AUTOTRADE_DB_PASSWORD: ${AUTOTRADE_DB_PASSWORD:-autotrade}
      AUTOTRADE_EXECUTION_COPY_GROUP: ${AUTOTRADE_EXECUTION_COPY_GROUP:-LIVE-SET}
      AUTOTRADE_EXECUTION_DAY: ${AUTOTRADE_EXECUTION_DAY:-}      # drills only: a replayed session date instead of today
      SERVER_ADDRESS: 0.0.0.0        # inside the container; the published port below is loopback-only
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    restart: unless-stopped

  # A branch-built UI next to the main one (user, 19 Oct: "build it on 8097"): trading-core in serve mode (display only,
  # no session, no alerts, no cues), the UI with the Accounts page, /api/execution forwarded to the execution worker.
  # No tokens and no zt mount: replays and history only read the auto-trade database. Opt-in:
  #   AUTOTRADE_CODE_VERSION=<tag> docker compose -p autotrade --profile preview up -d --no-deps ui-preview
  ui-preview:
    profiles: ["preview"]
    image: autotrade-trading-core:${AUTOTRADE_CODE_VERSION:-latest}
    container_name: autotrade-ui-preview
    command: ["--mode=serve"]
    environment:
      AUTOTRADE_DB_URL: jdbc:postgresql://postgres:5432/autotrade
      AUTOTRADE_DB_PASSWORD: ${AUTOTRADE_DB_PASSWORD:-autotrade}
      AUTOTRADE_UI_EXECUTION_URL: http://execution:8096
      ZT_SOURCE_URL: jdbc:postgresql://postgres:5432/zt_archive
      ZT_SOURCE_USER: autotrade
      ZT_SOURCE_PASSWORD: autotrade
      ZT_SOURCE_PASSWORD_FILE: /nonexistent
      JAVA_TOOL_OPTIONS: "-Xmx768m -XX:+ExitOnOutOfMemoryError"
      SERVER_ADDRESS: 0.0.0.0
      AUTOTRADE_AUTH_MODE: ${AUTOTRADE_AUTH_MODE:-none}
      AUTOTRADE_AUTH_PUBLIC_BASE: ${AUTOTRADE_AUTH_PUBLIC_BASE:-}
      AUTOTRADE_AUTH_INTERNAL_BASE: ${AUTOTRADE_AUTH_INTERNAL_BASE:-http://keycloak:8180/auth}
      AUTOTRADE_AUTH_CLIENT_SECRET: ${AUTOTRADE_AUTH_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8097:8095"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: autotrade-valkey
    profiles: [platform]
    ports:
      - "127.0.0.1:6390:6379"
    restart: unless-stopped

  # Per-user logins (L3, autotrade.auth.mode=oidc): Keycloak under /auth. KC_HOSTNAME is the address browsers use, so the
  # token issuer is always that address, while trading-core fetches tokens and keys over the compose network
  # (backchannel dynamic). Realm, client and roles: bin/keycloak/bootstrap.sh. Dev mode (H2 in the keycloak-data volume)
  # on the Mac; a server deployment uses start with its own database (docker-compose.gcp.yml).
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: autotrade-keycloak
    profiles: [platform]
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "8180"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8180/auth}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped

volumes:
  keycloak-data:
    name: autotrade-keycloak-data
  pgdata:
    name: autotrade-pgdata
