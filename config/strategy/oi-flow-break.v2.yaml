# OI flow break, v2 (user 2026-10-17 ~08:06: "ignore the levels in the rule and start replay"; ledger A-121).
# v2 = v1 without the level-break condition: every 1-minute close with one side's near-ATM OI building and the other's
# unwinding, the futures OI state agreeing, futures volume >= 1x and the index on the VWAP side. With no broken level the
# index stop is 1 ATR(3m) from the entry (round number); VWAP trail, 30 % premium stop and 15:15 as v1. v1 notes follow.
#
version: ofb-v2
strategy: oi-flow-break
status: UNCALIBRATED
source: "user-request-2026-10-17 (A-121 = A-120 without levels; user's values, fixed at registration)"

scope:
  entry_from: "09:30"
  last_new_entry: "14:30"              # exclusive
  flat_by: "15:15"
  time_stop_min: 0
  skip_expiring_index: true

setup:
  min_futures_rvol: 1.0                # user: relax participation to 1x normal
  stop_atr_inside: 0.5                 # v1 only (unused when no level is required)
  require_level_break: false           # v2: no level break needed
  stop_atr_from_entry: 1.0             # v2: index stop 1 ATR(3m) from the entry

position:
  premium_budget: 250000
  intended_lots: 1
  strike_offset: 0                     # ATM

exits:
  premium_stop_pct: 30                 # emergency only
  vwap_trail_3m: true                  # exit on a 3-minute close back through the session VWAP
  use_target: false
