# Expiry swing rider, v3 (user 2026-10-07 02:20 IST: "yes register it and test after the close"; ledger A-052).
# A new version beside the live set; no existing strategy changes. esr-v1 (A-050) failed on ticks because one loss at
# the whole budget tripped the account's daily loss limit and blocked the trend rider. v3 = v1 plus:
#  - risk.stop_after_consecutive_losses 2: no new entry for the rest of the day after two losing trades in a row (on the
#    bar data this kept 1 Oct's afternoon and cut 17 and 29 Sep after two losers; chosen after seeing those days, so it
#    is mildly fitted and is judged on the tick replays and forward days);
#  - premium budget Rs 1,50,000 and a 35 % resting premium stop: two stopped trades lose about Rs 1,05,000, under the
#    Rs 1,10,000 account limit, so esr alone cannot reach the kill switch before its own stop for the day (slippage
#    aside). Under risk v9 the budget scales with equity like every other strategy's.
# Everything else as v1: 0.25 % swing reversals of one-minute closes on the index that expires today, ATM, flat 15:15.
