# ATM OI burst, v1 (A-158; user 2026-10-21: "yes register and build it and run in shadow ... it should be based on data").
# Entry = A-157's rule, chosen on 1, 5-9 Oct and checked on 12-19 Oct (own-capture tick days): the 3-minute net OI change
# over the ATM +- 2 strikes (puts written minus calls written, share of those strikes' OI) at least 3x the day's mean so
# far, with the last 3 minutes' futures volume at least 1.5x the day's earlier 3-minute median. Exit E2 chosen by the
# A-158 exit study on 1, 5-9 Oct: hold until a burst of the same strength the other way, else 15:15; 30 % premium stop.
# Shadow only (SHADOW-1, its own session). Every value is fixed by the ledger, not tuned.
# v2 (A-159, user 2026-10-21: "Choose - Premium trail (+20 % arm, 15 % giveback)"): identical to v1 except the exit:
# the premium trail (exit study candidate E3) replaces the opposite-burst exit.
# v6 (A-180, user 2026-10-23: "yes register and test A-180", "try replay on 18 tick days"): v2 + the day's means from 09:30
# (the open's OI build no longer raises the bar) + a sustained-flow trigger (23 Oct 09:48-10:16: 25 minutes of writing at
# 1.5-2.4x the mean, never a 3x spike).
# v7 (A-181, user 2026-10-23: "yes register and test the fixed sustained rule"): v6 + the sustained trigger needs the newest
# 3-min share on its side and no single share above 40 % of the sum (v6's 23 Oct 13:56 call rode one old squeeze window).
version: aob-v7
strategy: atm-oi-burst
status: UNCALIBRATED
source: "A-157 / A-158 / A-159 / A-180 / A-181 (user 2026-10-21; rules fixed in the ledger before each computation; exit chosen by the user)"

scope:
  entry_from: "09:31"                  # the first snapshot carrying the 09:30 minute
  last_new_entry: "14:46"              # exclusive: signals to the 14:45 minute
  flat_by: "15:15"
  time_stop_min: 0                     # no time stop: the exit is the opposite burst, the premium stop or 15:15
  skip_expiring_index: false           # A-157 counted the expiring index too

entry:
  burst_k: 3.0                         # |3-min share| >= 3 x the day's mean |3-min share| so far
  min_history: 10                      # earlier snapshots (from 09:16) needed for that mean
  volume_ratio_min: 1.5                # last 3 minutes' futures volume vs the median of the day's earlier 3-minute windows
  same_direction_gap_min: 15           # A-157's one event per 15 minutes per direction (both triggers)
  mean_from: "09:30"                   # A-180: the day's means count minutes from 09:30 only
  sustained_k: 2.0                     # A-180: |sum of the 3-min shares at m, m-3, ..., m-12| >= 2 x the day's mean of it ...
  sustained_agree: 4                   # ... with >= 4 of those 5 on its side; no volume condition
  sustained_newest_same_side: true     # A-181: the newest 3-min share (at m) on the sum's side
  sustained_max_share: 0.4             # A-181: no single one of the five above 40 % of the sum

position:
  premium_budget: 250000
  intended_lots: 1
  strike_offset: 0                     # ATM

exits:
  premium_stop_pct: 30                 # emergency stop on the option (A-158)
  trail_activation_pct: 20             # exit E3: armed once the option's bid is 20 % above the entry premium ...
  trail_giveback_pct: 15               # ... then out when the bid falls 15 % below its peak
  use_target: false
