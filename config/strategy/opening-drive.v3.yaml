# v3 (2026-10-01, user's decision: "allow the system to re-enter, don't put any restrictions on no. of trades as long as data is valid"):
# odb-v2 with no limit on trades (scope.max_trades: 0): after a trade closes a level trades again once spot has come back to its untouched side and broken it again, still only 09:16-09:25. Every entry still needs its own signal, valid data (feed age, spread) and the risk limits.
# Opening drive through prior-day levels, v2 = v1 + a smaller budget on expiry days (user's decision, 2026-09-28: "create as strategy, let it
# trigger and trade as we are running in PAPER mode", "trade with sufficient quantity of 5,00,000").
# From the 28 Sep NIFTY open (PDL and prior ORL broken in the first minute, −157 points by 09:21).
# Rules as studied in docs/studies/2026-09-28-opening-drive.md, WITHOUT its volume filter (the
# registered ≥ 1.5× filter passed on no day, the design day included). Evidence is thin: 2 test-day
# trades in 24 usable index-days (both small wins, one day) — this is a forward PAPER test.
# Every trading day, NIFTY and SENSEX (trade-underlyings). Risk: paper-risk v4 (capital enforced; its
# ₹1,10,000 daily loss limit engages the kill switch before the −25 % stop on a full ₹5L position).
version: odb-v3
strategy: opening-drive
status: UNCALIBRATED
source: "user-decision-2026-09-28 (v2: expiry-day capital reserve)"

scope:
  trigger_from: "09:16"                # snapshot times: the 09:16:00 snapshot carries the 09:15 bar's close
  trigger_until: "09:26"               # exclusive: the last trigger is the 09:25:00 snapshot (bar 09:24)
  time_exit: "10:00"                   # flat at the first snapshot at or after this
  levels:                              # a level counts only if the day opened on its untouched side
    CE: [PDH, PRIOR_ORH]
    PE: [PDL, PRIOR_ORL]
  min_previous_session_minutes: 355    # prior-day levels need a (nearly) complete previous session of bars
  max_trades: 0                        # v3: no limit (v2: 1 a day); each re-entry needs a fresh break of a level
  max_entry_attempts: 2                # an entry refused or unfilled may be sent once more, still in the window

position:
  strike_offset: 0                     # ATM
  premium_budget: 500000               # user: sufficient quantity for ₹5,00,000 of premium (capped by free capital)
  # v2 (user, 2026-09-28: "on expiry days keep some capital" for ECR). On a day when NIFTY or SENSEX
  # expires (the executor reads it from the option quotes; a Tuesday NIFTY expiry also limits a SENSEX
  # entry, since capital is shared) the whole position is ₹1,00,000, leaving ₹4,00,000 free:
  # - an entry that does not fit the free capital is refused outright, never shrunk, so the reserve must
  #   cover ECR's whole entry: its expiry-day entries in replays took ₹2.46L, ₹2.46L, ₹2.49L and ₹3.84L;
  # - the worst opening-drive loss (−25 % stop plus slippage, ~₹30,000) stays far from the ₹1,10,000
  #   daily loss limit, whose kill switch would otherwise block the 12:30 straddle for the day.
  # Cost: on 8 Sep (the one expiry day it traded, +₹1,06,230 at ₹5L) it would have made about a fifth.
  expiry_day_premium_budget: 100000

exits:
  premium_stop_pct: 25                 # resting stop in the executor, 25 % below average cost
  structure_stop: true                 # snapshot spot back at or beyond the broken level → exit
  trail_activate_pct: 20               # once the best bid reaches 1.20 × average cost …
  trail_giveback_pct: 20               # … exit when the bid falls to 0.80 × that best bid
