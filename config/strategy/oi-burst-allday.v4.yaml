# oba-v4 = oba-v1 (A-258) + A-266's gap rule: no entry in the direction of an opening gap of 0.4 % or more.
version: oba-v4
strategy: oi-burst-allday
status: UNCALIBRATED
source: "user-request-2026-10-29 (ledger A-266)"

scope:
  entry_from: "09:21"
  last_new_entry: "14:31"              # exclusive
  flat_by: "15:15"                     # before the expiry-day index freeze (15:15-15:28)
  time_stop_min: 0
  skip_expiring_index: false           # the study included expiry days

setup:
  skip_gap_continuation_pct: 0.4       # A-266: no entry in the gap's direction when the opening gap is >= 0.4 %
  ema_period: 20                       # EMA of 1-minute closes, seeded with the previous close
  cross_lookback_min: 3
  fresh_cross: false                   # v3/v4: the close on the burst's side of the EMA is enough
  share3_min_nifty: 0.0446             # A-258: 95th percentile of the absolute 3-minute share, P1 ALL-DAY minutes
  share3_min_sensex: 0.0599
  max_entries_per_day: 3               # A-258: one position at a time
  reversal_ends_day: false             # A-258: a non-continuation burst is skipped
  stop_lookback_min: 10                # stop: the 10-minute extreme of minute closes before entry

position:
  premium_budget: 250000
  intended_lots: 1
  strike_offset: 0                     # ATM

exits:
  premium_stop_pct: 50                 # v2/v4: emergency only
  structure_buffer_pct: 0.1            # v2/v4: stop = a close beyond PDH/ORH (puts) or PDL/ORL (calls) +- 0.1 %
  counter_burst: true                  # v2/v4: exit on a 3-minute burst beyond the threshold against the trade
  atr_stop_mult: 2.0                   # A-254: stop = the tighter of the structure stop and entry -+ 2.0 x ATR3m
  trail_arm_atr: 2.0                   # A-255: the trail arms once a close is +2.0 x ATR3m in favour
  trail_atr: 3.0                       # A-255: then exit on a close 3.0 x ATR3m below the best close since entry
  use_target: false
