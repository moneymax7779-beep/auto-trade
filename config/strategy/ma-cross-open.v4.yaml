# mco-v4 (2026-11-22, A-546, user: "wait for any of all available nearest levels to break"): mco-v1, but a cross enters only when the index trades beyond the nearest level in its direction (OR high/low, prior-day high/low/close, prior-week and prior-month high/low) while the averages still agree, before 10:21.
version: mco-v4
strategy: ma-cross-open
status: UNCALIBRATED
source: "A-546 registration (user, 22 Nov), rules fixed before the replay"

scope:
  entry_from: "09:30"
  last_new_entry: "10:21"              # exclusive: from 10:21 mac-v34 itself sees crosses
  flat_by: "15:15"
  time_stop_min: 60
  skip_expiring_index: true

setup:
  max_stop_atr: 3.0                    # of the carried ATR(3m)
  carried_emas: true                   # A-537: cross, swing stop and ATR from the carried indicators
  level_break: true                    # A-546
  reward_to_risk: 2.0                  # target = entry + 2 x (entry - stop)
  # the averages are the carried EMA9 and EMA20 of 3-minute bars (structure.carriedEma9 / carriedEma20)

position:
  premium_budget: 250000
  intended_lots: 1
  strike_offset: 0                     # ATM

exits:
  premium_stop_pct: 25                 # emergency only; the index-level stop comes first
  early_fail_min: 15                   # A-334
  early_fail_pct: -7.5
