# obc-v31rel (A-595, 24 Nov 2026): obc-v31ppre with the burst measured against the day's own OI flow (burst_mode relative,
# k 3.0, 3 earlier minutes with a print), no fixed share for entries; exits unchanged (counter-burst at share3_min).
# obc-v31ppre (A-593, 24 Nov 2026): obc-v31re2b (A-590 R2) + obc-v31ppng's four changes (A-587 P2): per-print burst, EMA seeded at
# the open, entries from 09:18, no gamma veto. Everything else = obc-v31.
# obc-v31 (A-472, 17 Nov 2026): obc-v28 + no PE entry when gexShare > 0.06 (middle of A-471's gap: PE winners <= 0.050, vetoed
# PE losers >= 0.070) and no CE entry when gexShare > 0.25. Chosen on the tick days; the held-out read decides.
# obc-v13 = obc-v11 (A-260) + A-266's gap rule: no entry in the direction of an opening gap of 0.4 % or more.
version: obc-v31rel
strategy: oi-burst-cross
status: UNCALIBRATED
source: "user-request-2026-11-16 (A-472)"

scope:
  entry_from: "09:18"                  # A-587 P2; was 09:21: the study's 09:20-11:00 minutes, seen by the engine one snapshot later
  last_new_entry: "11:01"              # exclusive
  flat_by: "15:15"                     # A-260: before the expiry-day index freeze (15:15-15:28)
  time_stop_min: 0
  skip_expiring_index: false           # the study included expiry days

setup:
  skip_gap_continuation_pct: 0.4       # A-266: no entry in the gap's direction when the opening gap is >= 0.4 %
  ema_period: 20                       # EMA of 1-minute closes, seeded with the previous close
  cross_lookback_min: 3
  fresh_cross: false                   # v3/v4: the close on the burst's side of the EMA is enough
  max_entries_per_day: 2               # A-590 R1: a second entry per index-day (new burst after the exit)
  share3_min_nifty: 0.0612             # ATM +- 2 net OI flow share over 3 minutes (A-250 P1 95th percentile)
  share3_min_sensex: 0.0816
  burst_mode: relative                 # A-595: s1 or s3 >= relative_k x median |s| of today's earlier minutes with a print
  relative_k: 3.0                      # A-595, fixed before the replay; not varied
  relative_min_samples: 3              # A-595
  ema_seed: open                       # A-587: EMA20 starts at the day open
  stop_lookback_min: 10                # stop: the 10-minute extreme of minute closes before entry

position:
  premium_budget: 250000
  intended_lots: 1
  strike_offset: 0                     # ATM

exits:
  premium_stop_pct: 50                 # v2/v4: emergency only
  below_entry_exit_min: 15             # A-469 (user 16 Nov: "go ahead, build it and run on tick days")
  below_entry_0dte_only: true          # not on other days (A-468: all-day no-progress exits cost obc -5.3 / -3.1 L)
  below_entry_minute_close: true       # A-470 (user 16 Nov: "go ahead, build the fix and run on tick days")
  below_entry_no_reentry: false        # A-590 R2: a below-entry exit no longer blocks the second entry
  structure_buffer_pct: 0.1            # v2/v4: stop = a close beyond PDH/ORH (puts) or PDL/ORL (calls) +- 0.1 %
  counter_burst: true                  # v2/v4: exit on a 3-minute burst beyond the threshold against the trade
  atr_stop_mult: 2.0                   # A-254: stop = the tighter of the structure stop and entry -+ 2.0 x ATR3m
  trail_arm_atr: 2.0                   # A-255: the trail arms once a close is +2.0 x ATR3m in favour
  trail_atr: 3.0                       # A-255: then exit on a close 3.0 x ATR3m below the best close since entry
  use_target: false
