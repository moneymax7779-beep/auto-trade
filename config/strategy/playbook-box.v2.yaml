version: pbb-v2
strategy: playbook-box
status: UNCALIBRATED
source: "user-request-2026-10-26 (four-strategy playbook; ledger A-244)"

scope:
  entry_from: "09:20"                  # golden windows 09:20-10:30 and 13:00-15:00 (gap below)
  last_new_entry: "15:00"              # exclusive; flat 15:15
  flat_by: "15:15"
  time_stop_min: 0                     # the playbook's time-outs are in the strategy
  skip_expiring_index: false

setup:
  kind: BOX
  role: FULL
  candle_min_nifty: 3                  # NIFTY 3-minute candles
  candle_min_sensex: 5                 # SENSEX 5-minute candles
  buffer_points_nifty: 5               # "5 points"
  buffer_points_sensex: 15             # the same distance in % at SENSEX's level
  gap_from: "10:30"                    # no entries in the mid-day lull
  gap_until: "13:00"
  max_trades_per_day: 2                # per index
  box_candles_nifty: 10                # 30 minutes
  box_candles_sensex: 6                # 30 minutes
  box_max_atr_nifty: 1.56              # v2: 10th percentile of the 30-min box width, NIFTY bars 23 Jan-31 Aug (0.4 never occurs)
  box_max_atr_sensex: 1.25             # v2: the same for SENSEX 6 x 5-min candles
  coi_3m_min_abs: 1000000              # |ATM +-5 OI change over 3 min| in the break direction (OI units)
position:
  premium_budget: 250000
  intended_lots: 1
  strike_offset: 0

exits:
  premium_stop_pct: 50                 # emergency only; the playbook's stops are on the index
