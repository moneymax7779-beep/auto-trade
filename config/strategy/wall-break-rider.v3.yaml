# Wall-break rider, v3 (user 2026-11-06 ~16:00 IST: "yes register wbr-v3 and run it in shadow, do the replay I want to
# see"; ledger A-327). v2's entry and window, plus the changes read from the loss analysis of v2's 20 tick-day trades
# (.local/wbr-analysis): (1) no entry when the index already moved more than 4 ATR(3m) toward the trade over the last
# 30 minutes (late in the burst); (2) after a losing trade, no entry on the opposite side for 60 minutes; (3) premium stop
# 40 % (v2 30 %, expiry-day ATM options swing 30 % on noise); (4) no no-progress exit; (5) trail arms at +100 % and exits
# 25 % below the peak (v2 +50 % / 15 % sold the expiry moves early); (6) the wall strike at entry, once crossed, is the
# line: a 3-minute close back through it exits (WALL_LOST). Values fixed at registration, not tuned further. The tick-day
# replay is in-sample; the forward shadow against v2 decides (20 expiry days).
version: wbr-v3
strategy: wall-break-rider
status: UNCALIBRATED
source: "user-request-2026-11-06 (A-327; values fixed at registration from the A-327 loss analysis)"

scope:
  dte: 0                               # only the index that expires today
  entry_from: "10:30"
  last_new_entry: "14:30"
  flat_by: "15:15"

signal:
  confirm_minutes: 2                   # the signal on 2 consecutive snapshots
  wall_oi_drop_pct: 5                  # v2: wall OI down >= 5 % over 10 min, index moving toward it over 3 min
  reject_futures_states:               # futures OI must not oppose the move
    CE: [FRESH_SHORT]
    PE: [FRESH_LONG]
  max_prior_move_atr: 4                # v3: no entry after a > 4 ATR(3m) move toward the trade ...
  prior_move_min: 30                   # ... over the last 30 minutes
  no_flip_after_loss_min: 60           # v3: after a losing trade, the opposite side waits 60 minutes

position:
  premium_budget: 250000               # half the starting capital (risk scales it with equity); last in order
  intended_lots: 1
  strike_offset: 0                     # ATM

exits:
  premium_stop_pct: 40                 # v3 (v2 30): resting emergency stop
  trail_activation_pct: 100            # v3 (v2 50): the trail arms at +100 % on the bid ...
  trail_giveback_pct: 25               # ... and exits 25 % below the peak bid (v2 15)
  time_stop_min: 0                     # v3: no no-progress exit (v2 15 min / +10 %)
  time_stop_min_gain_pct: 10           # unused while time_stop_min is 0
  wall_recross_exit: true              # v3: once crossed, a 3-minute close back through the entry wall exits
