# Market-phase table, row "Institutional Squeeze" (A-239; user 2026-10-26: "I want strategies from these and then replay on
# tick days", NIFTY BANK column dropped: "ignore NIFTY BANK for now"). Every value fixed in the ledger before the replay.
# Buy the ATM call when, on one 1-minute close: the index broke above ORH / PDH / prior ORH / PWH within the last 5 closes
# and is still above it; VIX < 14 and up over 15 min; futures up with OI down over 15 min (short covering) and futures
# time-of-day RVOL >= 1.5; ATM +-5 call OI falling and put OI rising over 3 min (features v15); FII index-futures long
# share up in the last published participant-OI file.
