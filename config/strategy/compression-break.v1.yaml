# Compression break, v1 (user 2026-10-18, the 1 Oct chart: a three-hour box on dead futures volume, then the 12:07 break
# on a 16x volume surge; "build both and run on tick days"). Ledger A-140.
# Box: the last 60 one-minute closes, height <= 0.4 % of the index (1 Oct NIFTY 80 pts = 0.35 %, SENSEX 244 pts = 0.34 %),
# mean futures time-of-day RVOL over the box <= 1.0 (quiet). Break: a close beyond the box, confirmed within 3 closes by
# RVOL >= 2 and the near-ATM OI flow agreeing (the user's OI thesis). One trade per index per day. Stop: a close back inside
# the box. Exit: hold to 15:15. Values are round numbers or the 1 Oct reading, chosen by me, fixed at registration.
version: cbk-v1
strategy: compression-break
status: UNCALIBRATED
source: "user-request-2026-10-18 (A-140; values from the 1 Oct chart or round numbers, fixed at registration)"

scope:
  entry_from: "10:15"                  # the earliest 60-minute box ends 10:15
  last_new_entry: "14:30"              # exclusive
  flat_by: "15:15"
  time_stop_min: 0
  skip_expiring_index: false

setup:
  box_minutes: 60
  box_max_pct: 0.4                     # box height as % of the index
  quiet_rvol_max: 1.0                  # mean time-of-day RVOL inside the box
  min_rvol_tod: 2.0                    # the break's volume surge
  confirm_minutes: 3                   # RVOL and flow may confirm up to 3 closes after the break while beyond the box
  require_flow: true                   # near-ATM OI: down = call OI building + put OI unwinding (1 or 3 min); up mirrored

position:
  premium_budget: 250000
  intended_lots: 1
  strike_offset: 0

exits:
  premium_stop_pct: 30
  use_target: false
