# obc-v3 = entries without a fresh EMA cross + obc-v1 exits (A-252 arm E); user 2026-10-27 on 12 / 23 Oct. Registered before any replay; everything else obc-v1.
# OI burst + EMA cross, continuation (A-251; user 2026-10-27: "yes register and run in PAPER mode, also do the replay in
# tick days"), the rule frozen from the A-250 bar study (Oct 2024-Oct 2026: continuation +16.0 % / +51.6 % / +8.3 % per
# trade in its three periods on 18 / 6 / 33 trades, 95 % CI including 0: INSUFFICIENT, so this runs forward in PAPER and
# is read once at 30 forward trades). Thresholds = A-250's P1 95th percentiles; every value fixed, not tuned.
version: obc-v3
strategy: oi-burst-cross
status: UNCALIBRATED
source: "user-request-2026-10-27 (A-252 arm, ledger A-252)"

scope:
  entry_from: "09:21"                  # the study's 09:20-11:00 minutes, seen by the engine one snapshot later
  last_new_entry: "11:01"              # exclusive
  flat_by: "12:30"                     # the study's exit
  time_stop_min: 0
  skip_expiring_index: false           # the study included expiry days

setup:
  ema_period: 20                       # EMA of 1-minute closes, seeded with the previous close
  cross_lookback_min: 3
  fresh_cross: false                   # v3/v4: the close on the burst's side of the EMA is enough
  share3_min_nifty: 0.0612             # ATM +- 2 net OI flow share over 3 minutes (A-250 P1 95th percentile)
  share3_min_sensex: 0.0816
  stop_lookback_min: 10                # stop: the 10-minute extreme of minute closes before entry

position:
  premium_budget: 250000
  intended_lots: 1
  strike_offset: 0                     # ATM

exits:
  premium_stop_pct: 25                 # the study's 25 % premium stop
  use_target: false
