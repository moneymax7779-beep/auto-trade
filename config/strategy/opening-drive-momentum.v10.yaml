# odm-v10 = odm-v4 (live) with the user's exit (user 2026-10-17 ~16:35: "the exit should be level broken and OI change
# reversed or slowly reversing"; ledger A-127): at a 3-minute close, the index back through the nearest real level beyond
# the entry on the losing side (puts: the lowest of the day open, ORH, PDH, prior ORH, PWH and the call barrier at entry
# that is above the entry price; calls mirrored) AND near-ATM OI turned against the trade over 5 or 10 minutes (puts: put
# OI up, call OI down). No session-extreme index stop (replaced by this exit); the 50 % premium stop, the 50/15 peak trail
# and 12:00 stay. No VWAP, no small swings, no 1-minute OI (A-122: those made the exit fire on noise). odm-v4 notes follow.
#
version: odm-v10
strategy: opening-drive-momentum
status: UNCALIBRATED
source: "user-request-2026-10-17 (A-127 = odm-v4 + level-and-OI exit, no index stop; values from the Jan-Jun index screen, fixed at registration)"

scope:
  entry_from: "09:21"                  # the first 3-minute closes: 09:21, 09:24, 09:27, 09:30
  last_new_entry: "09:31"              # exclusive
  flat_by: "12:00"                     # the screen's exit
  time_stop_min: 0
  skip_expiring_index: true            # the expiring index (0 DTE) belongs to the expiry strategies

setup:
  min_move_pct: 0.2                    # at least 0.2 % from the day's open
  max_pullback_frac: 0.3               # and still in the outer 30 % of the session's range on that side

position:
  premium_budget: 250000
  intended_lots: 1
  strike_offset: 0                     # ATM

exits:
  premium_stop_pct: 50                 # emergency only; the index stop (session extreme) comes first
  use_target: false
  trail_activation_pct: 50             # v4 (A-091): the trail arms when the held option's bid is 50 % above its cost
  trail_giveback_pct: 15               # v4: then exit when the bid is 15 % below its running peak
  level_oi_exit: true                  # v10 (A-127): exit = real level broken against AND OI reversed over 5 or 10 min

filters:
  breadth_min_agree: 50                   # A-088: breadth filter: enter only with mover breadth >= 50 in the trade's direction (calls +50, puts -50)
