# follower-risk v19 (user 23 Nov 2026: "yes build fixes 1-4 on a branch", fix 4: realistic paper fills): v18 with one
# addition, simulation.entry_fill: captured_book. A simulated entry (a PAPER account or paper twin, a DRY_RUN account with no
# broker) fills as a real marketable limit would have on our own captured book (md.option_tick) instead of always at the
# signal's price: limit = the ask when the signal was decided + orders.entry_buffer_ticks; the order arrives
# simulation.latency_ms later and fills at the ask then if within the limit, else at its limit the first time the ask comes
# down to it within orders.entry_timeout_sec, else not at all (NOT_FILLED, as a broker entry). On 23 Nov 11:03 a twin on
# v18 "bought" NIFTY 25550 PE at 80.35 while the ask was 81.75-82 and every real entry on that signal went unfilled.
# Exits, straddles and retried adds still fill at the signal's / retry's price. A contract with no captured ask within
# 10 s before the signal fills at the signal's price as before. LIVE accounts are not affected (their broker fills them).
# Everything else is exactly v18.
# v18:
# follower-risk v18 (user 22 Nov 2026: "yes build v18 with 22% of equity"; the daily loss limit is meant as 22 % of the
# capital): v17 with capital.daily_loss_pct 10 -> 22. For an account without its own rupee limit (acct.broker_account.
# daily_loss_limit null: the Accounts page's loss field left empty), the day's loss limit is 22 % of that day's equity
# (allocation + capital movements + realised net since equity_from when COMPOUNDING), so it follows the account up and
# down instead of staying a fixed rupee figure. The same limit drives the entry check (DAILY_LOSS), the open-loss stop that
# sells everything (v11) and the stop-risk cap (v14/v15). An account with its own rupee limit keeps that limit. Example,
# ZERODHA-1: equity 3 L -> 66,000 (= today's fixed limit); 4 L -> 88,000; 2.5 L -> 55,000. Everything else is exactly v17.
# v17:
# follower-risk v17 (user 22 Nov 2026: "real capital should be allocated just like how the PAPER allocation does, and if any of
# the strategy is not selected for live should auto adjusted among all other remaining strategies"; chose "fill to 100 %, never
# less" and an opt-in file): v16 with one addition, live.fill_allocation: true. A LIVE entry's budget is already PAPER-1's
# fraction (strategy budget / Rs 5 L reference x the account's equity). On v17, when the strategies selected for LIVE on the
# account (that it subscribes to and the signal source runs) have budgets adding up to less than the reference capital, each is
# scaled up by reference / their sum, so together they fill the account's equity in PAPER-1's proportions; the factor is
# never below 1 (all six selected = today's sizes) and the extra comes from spare capital only (0.97 x free). Example, Rs 5 L
# account: mac + obc selected = 2.5 L each (already 100 %, unchanged); mac alone = up to 5 L. Trade-off (review 22 Nov):
# one filled entry can leave no room for a later one the same day (mac alone: a NIFTY entry near 5 L, then a SENSEX mac
# signal is refused for capital where v16's two 2.5 L entries both fit); adds of a plan strategy scale the same way. The
# shared caps still apply: open premium <= equity, the stop-risk cap, the daily loss limit, broker funds.
# Everything else is exactly v16.
# v16:
# follower-risk v16 (user 22 Nov 2026: "ma-cross-open v7 make it eligible for live and PAPER/LIVE to place LIVE orders"): v15 with
# one change, ma-cross-open added to live.strategies, so the owner may choose it to trade LIVE on an account on this file
# (Accounts page; the owner's global LIVE list and the account's own choice still decide). Not in default_strategies: an
# account the owner has not chosen for trades exactly what it did on v15. Evidence (A-558/A-560): 37 own-capture tick days,
# in-sample, mco-v7 alone 5 trades 5 won +Rs 11.39 L; thin (+48K over mco-v2 without 20 Nov), and mco-v2 alone lost on the
# Oct 2024-May 2025 bar days (A-548, stopped). Everything else is exactly v15.
# v15:
# follower-risk v15 (user 19 Nov 2026, "build v15 and switch ZERODHA-1 to it"; code review of v14): v14 with one addition,
# capital.stop_risk_counts_realised: true. The stop-risk room is the day's loss limit less what the open positions could
# lose to their broker stops (v14) and now also less the day's realised loss: after a -15K morning on a 22K limit only
# 7K of stop risk is left, so the closed loss plus the broker stops stay within the day's limit even if the worker or
# its prices stop (v14 allowed a full 22K more, a day near -37K). On ZERODHA-1's 35 LIVE entries it changes nothing
# beyond v14 (no day had a realised loss before a later entry that the cap would have cut). Everything else is v14.
# v14:
# follower-risk v14 (user 19 Nov 2026, account-management review step 2: "Stop-risk cap"): v11 with one addition,
# capital.max_stop_risk_pct_of_daily_loss: 100. What the open positions plus a new entry (or add) could lose before their
# broker stops sell them (each stop-limit filled at its limit: a 50 % stop loses 52.5 %, a 25 % stop 28.75 %) may be at
# most 100 % of the day's loss limit (the account's own rupee limit, else daily_loss_pct of equity). An entry is sized
# down to fit and refused under one lot (REJECTED_STOP_RISK). Why: on 19 Nov two oi-burst-cross entries with 50 % stops
# put Rs 41.7K at risk against ZERODHA-1's Rs 22K limit; the open-loss stop sells at the limit only while the worker
# and its prices run, the broker stops are the backstop. On ZERODHA-1's 35 LIVE entries it would have changed two:
# 12 Nov wall-break-rider sized down (-10.1K -> about -6.5K) and 19 Nov 09:24 NIFTY oi-burst-cross refused (+2.8K).
# Everything else is exactly v11.
# v11:
# follower-risk v11 (user 11 Nov 2026, ZERODHA-1: "I want to make my zerodha account to be allowed to trade the capital
# and stop loss specified"; answers: size "Full (size step 100 %)", lot ceiling "Allocation only", loss limit "Count
# open loss, close all"): v10 with the one-lot pilot caps lifted, so a LIVE account sizes every entry (and its adds)
# from its own allocation like a paper follower, and with the daily loss counting open positions:
#   - live.max_lots_per_order 1 -> 50 and positions.max_lots_per_underlying 2 -> 50 (no ceiling below what the
#     allocation buys: the capital limits below decide the size; 50 is only a guard against a sizing bug);
#   - capital.daily_loss_counts_open: true: closed trades + open positions marked at the bid; at the limit (the
#     account's own rupee limit, else daily_loss_pct of equity) every open position is sold and entries stop for the day.
# The account's size step (acct.broker_account.size_step_pct) must be above 0 for allocation sizing (100 = full size;
# 0 stays one lot). Every other limit is v10's: 3 open positions, premium in use <= equity, broker funds + 10 %,
# the broker stop, the LIVE strategy list and defaults.
version: follower-risk-v19
name: follower-risk
status: UNCALIBRATED

capital:
  daily_loss_pct: 22                   # v18: 22 % of the day's equity (v5-v17: 10)
  daily_loss_counts_open: true         # v11: closed + open (at the bid); at the limit sell everything, no entries today
  max_stop_risk_pct_of_daily_loss: 100 # v14: open + new loss to the broker stops <= the day's loss limit
  stop_risk_counts_realised: true      # v15: the day's realised loss comes off that room too
  max_premium_per_trade_pct: 100
  max_open_premium_pct: 100            # premium in use + this entry <= equity (paper-risk v17's capital check)
  broker_funds_buffer_pct: 10          # the broker's available funds must exceed the entry premium by 10 %

positions:
  max_open_positions: 3                # v10 (A-372; v7-v9 pilot: 2, v6: 4)
  max_lots_per_underlying: 50          # v11: allocation sizing (v7-v10 pilot: 2, v6: 400)

sizing:                                # as paper-risk v17
  rvol_boost_threshold: 1.5
  rvol_boost_factor: 1.5

simulation:                            # PAPER followers (simulated fills) only
  adverse_bps: 0
  entry_fill: captured_book            # v19: entries fill on our captured book (v18: signal_price, always filled)
  latency_ms: 500                      # v19: signal to the order reaching the book (real entries: ~150-450 ms on 23 Nov)

orders:                                # as paper-risk v17 orders (PAPER-1's OMS)
  entry_buffer_ticks: 4                # marketable limit: the broker's ask + 4 ticks
  entry_timeout_sec: 10                # what is unfilled after this is cancelled; the position is what filled
  exit_buffer_ticks: 4                 # sell limit: bid − max(4 ticks, exit_buffer_pct of the bid)
  exit_buffer_pct: 1.0
  exit_chase_sec: 2                    # an unfilled exit is re-priced at the new touch after this
  exit_chase_max: 6                    # re-pricings before the exit crosses exit_cross_pct through the touch
  exit_cross_pct: 5
  tick: 0.05                           # index option price step
  poll_ms: 250                         # how often the order book is pulled while an order works
  dry_run_market: BROKER               # v6: DRY_RUN reads the broker (funds, quotes + depth, instruments); orders simulated

broker_stop:                           # plan section 3: catastrophic stop resting at the broker after every entry fill
  default_stop_pct: 25                 # when the signal carries no stop_pct (the strategies publish theirs)
  limit_offset_pct: 5                  # its limit this far below the trigger (paper-risk v17 stop_limit_offset_pct)

live:                                  # v7: the LIVE pilot's hard limits (LiveGuard checks them again at the broker)
  max_lots_per_order: 50               # v11: allocation sizing (v7-v10 pilot: 1)
  max_open_positions: 3                # v10 (A-372; v7-v9: 2)
  # v9: the strategies the owner may choose to trade LIVE on an account (the live set of PAPER-1); the account's choice
  # (acct.broker_account.live_strategies, Accounts page) is what trades LIVE, never wider than this list
  strategies: [early-confirm-runner, expiry-trend-rider, ma-cross, oi-burst-cross, wall-break-rider, break-retest-runner, ma-cross-open]   # v16: + ma-cross-open
  # an account the owner has not chosen for: v7's list, so moving a v7 account to v9 changes nothing
  default_strategies: [early-confirm-runner, ma-cross, oi-burst-cross]
  fill_allocation: true                # v17: the LIVE-selected strategies share the whole equity in PAPER-1's proportions
