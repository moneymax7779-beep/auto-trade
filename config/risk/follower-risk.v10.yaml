# follower-risk v10 (user 10 Nov 2026: "LIVE slots first" -> "Yes, prepare v10"; ledger A-371 / A-372): v9 with the open-
# position limit raised from 2 to 3, in both positions.max_open_positions (the risk engine) and live.max_open_positions
# (LiveGuard at the broker). A-372 (offline, 28 own tick days, the five LIVE strategies' alone trades at 1 lot, Kite
# 1-lot costs): 2 slots took +1,58,867 per lot, 3 slots +1,95,653 (+15,751 / +21,035 by half, still up without each
# half's best day; worst day -5,870 vs -7,510; most premium open at once Rs 33,962 vs 25,873). Every other limit is v9's, unchanged: 1 lot per order,
# 2 lots per index, daily loss 10 %, the LIVE strategy list and defaults.
version: follower-risk-v10
name: follower-risk
status: UNCALIBRATED

capital:
  daily_loss_pct: 10                   # v5: Rs 20,000 on Rs 2,00,000 (user's limit); v3 had 22 as paper-risk v17
  max_premium_per_trade_pct: 100
  max_open_premium_pct: 100            # premium in use + this entry <= equity (paper-risk v17's capital check)
  broker_funds_buffer_pct: 10          # the broker's available funds must exceed the entry premium by 10 %

positions:
  max_open_positions: 3                # v10 (A-372; v7-v9 pilot: 2, v6: 4)
  max_lots_per_underlying: 2           # v7 pilot (v6: 400)

sizing:                                # as paper-risk v17
  rvol_boost_threshold: 1.5
  rvol_boost_factor: 1.5

simulation:                            # PAPER followers (simulated fills) only
  adverse_bps: 0

orders:                                # as paper-risk v17 orders (PAPER-1's OMS)
  entry_buffer_ticks: 4                # marketable limit: the broker's ask + 4 ticks
  entry_timeout_sec: 10                # what is unfilled after this is cancelled; the position is what filled
  exit_buffer_ticks: 4                 # sell limit: bid − max(4 ticks, exit_buffer_pct of the bid)
  exit_buffer_pct: 1.0
  exit_chase_sec: 2                    # an unfilled exit is re-priced at the new touch after this
  exit_chase_max: 6                    # re-pricings before the exit crosses exit_cross_pct through the touch
  exit_cross_pct: 5
  tick: 0.05                           # index option price step
  poll_ms: 250                         # how often the order book is pulled while an order works
  dry_run_market: BROKER               # v6: DRY_RUN reads the broker (funds, quotes + depth, instruments); orders simulated

broker_stop:                           # plan section 3: catastrophic stop resting at the broker after every entry fill
  default_stop_pct: 25                 # when the signal carries no stop_pct (the strategies publish theirs)
  limit_offset_pct: 5                  # its limit this far below the trigger (paper-risk v17 stop_limit_offset_pct)

live:                                  # v7: the LIVE pilot's hard limits (LiveGuard checks them again at the broker)
  max_lots_per_order: 1
  max_open_positions: 3                # v10 (A-372; v7-v9: 2)
  # v9: the strategies the owner may choose to trade LIVE on an account (the live set of PAPER-1); the account's choice
  # (acct.broker_account.live_strategies, Accounts page) is what trades LIVE, never wider than this list
  strategies: [early-confirm-runner, expiry-trend-rider, ma-cross, oi-burst-cross, wall-break-rider, break-retest-runner]
  # an account the owner has not chosen for: v7's list, so moving a v7 account to v9 changes nothing
  default_strategies: [early-confirm-runner, ma-cross, oi-burst-cross]
