# paper-risk v57 (A-632, 24 Nov 2026): v54 with Rs 2.00 L daily loss limit.
# paper-risk v54 (A-630, 24 Nov 2026): v48 with no new entries after 14:51 (was 14:45).
# paper-risk v48 (A-601, 24 Nov 2026): v44 with the daily loss limit at 20 % of equity (Rs 1,00,000 at Rs 5L) instead of 22 %.
# v44 (A-476, 17 Nov 2026; user: "when a higher-priority entry is short of capital, close the sbr position first to make
# room"): v43 + priority.low_preempt. Nothing else changes.
# v43 (A-475, 17 Nov 2026; user: "keep v21 in live PAPER ... shared capital put only 10% of the capital and not fixed,
# allocate only if no capital is fully used by the other strategies, otherwise keep priority to other strategies"):
# paper-risk v19 exactly, plus `priority`: the strategies listed in priority.low may enter only while, after the entry,
# at least low_keep_free_pct % of the capital (equity) is still free, so the other strategies keep the first claim on it.
# 50 % = the largest single live entry (mac / obc / wbr budgets are half the equity) always still fits. Judgment, not a fit.
# (Numbers v20-v42 are research files in other worktrees; this is the next free number.)
# v19 (A-358, 9 Nov 2026): v17 + a `shorts` section for the PAPER expiry short straddle (expiry-short-straddle.v1, the
# A-292 rule run as a shadow). Nothing else changes: every long-path value is v17's, so the live set behaves exactly as on
# v17. A short entry counts `margin_per_lot` x lots as capital in use (a long counts its premium), may sell at most
# `max_lots`, and is refused outright by any risk file without this section. The margin is an estimate to be replaced
# with the broker's figure before any short reaches a real account (none does: a signal-source session refuses it).
# v17 (A-106, 15 Oct 2026): v12 + a single-leg entry at 1.5 x its premium budget when futures RVOL >= 1.5 at entry.
# Everything else is v12.
# Pre-trade risk limits for PAPER trading. Exits are never blocked by risk; these limits stop new
# entries and adds, and force a square-off. Values are placeholders chosen for one research account.
# v2 (2026-09-25): exits price at bid − max(4 ticks, 1%) and re-price every 2 s (v1: bid − 4 ticks,
# 5 s), after a replay showed a falling bid outrunning the exit for 13 s. Execution only; no strategy change.
# v12 (2026-10-08 21:15 IST, user: "yes build and test the cap"; ledger A-062): v10 with entries sized to the market.
# (1) Single-leg entries and adds are sliced: no child order larger than the ask quantity within 0.5 % of the best ask
# at that moment, the next slice on the next quote; slicing stops 10 s after the first slice (entry timeout) or when the
# ask has run 2 % above the first slice's ask, and the position keeps what it bought. (2) An entry or add buys at most
# 2 % of the option's premium traded over the previous minute. Measured 8 Oct (docs/studies/2026-10-08-expiry-option-
# capacity.md): SENSEX expiry ATM books show about Rs 2L within 0.5 % of the ask, NIFTY about Rs 9-13L, Rs 13-15 Cr
# trades per minute. Straddle legs keep their own entry. v11 (entry buffer) failed A-055 and is not part of v12.
# v10 (2026-10-07 07:20 IST, user: "start the sizing from 5,00,000 from today"; ledger A-054): v9 with the equity
# counted from 7 Oct 2026 only: capital = Rs 5,00,000 + the realised net of finished live sessions on or after
# account.equity_from. The earlier live record (-Rs 1,05,361, 25 Sep-6 Oct) stays in the database and the reports but
# no longer reduces the size. Everything else as v9.
# v9 (2026-10-07, user: "switch to v9 and deploy before 09:00", for the goal of Rs 10 crore by 31 Dec; ledger A-047):
# v8 with the whole equity available per trade (premium_budget_pct 100) and the daily loss limit 22 % of equity, so at
# Rs 5,00,000 it behaves exactly like v4 (full capital, Rs 1,10,000 daily limit) and every budget then follows the equity
# up and down. Sizing cannot create an edge: it compounds whatever the strategies earn, losses included.
# v8 (2026-10-06, user's decision to compound; ledger A-046): v4 with the capital following the account's equity.
# capital = starting_capital + the realised net of every finished live PAPER session on the account (replays and
# shadow: the starting capital). Each strategy's premium budget = its file budget x equity / starting_capital x
# premium_budget_pct (50 %: one trade may hold half the equity as premium; two strategies may hold it all). The
# daily loss limit is daily_loss_pct of equity (15 %; v4: a fixed Rs 1,10,000 = 22 % of Rs 5L). Judgment, not a fit.
version: paper-risk-v57
# v4 (2026-09-27, user's decision): the expiry-breakout straddle trades the full ₹5,00,000 as premium.
# The daily loss limit rises from ₹10,000 to ₹1,10,000 (its −20 % combined stop on ₹5,00,000 plus slippage),
# up to 4 open positions (a straddle is two), and up to 400 lots per underlying (a full-capital
# straddle is ~100 lots a leg). Capital itself is now enforced: premium in use + a new entry must fit
# in account.capital, so while the straddle holds the capital other strategies' entries are refused.
# v3 (2026-09-26): for the closing-auction mode of strategy ecr-v4. The square-off moves from 15:20
# to 15:36 (after the auction ends at 15:35, before the 15:40 derivatives close) and new entries are
# allowed again inside the CAS entry window 15:20-15:30. Everything else is unchanged from v2.
name: paper-risk
status: UNCALIBRATED

account:
  capital: 500000                      # the fallback (capital_mode fixed); v8 sizes from equity instead
  capital_mode: equity                 # v8: equity = starting_capital + realised net of finished live sessions
  starting_capital: 500000
  equity_from: "2026-10-07"            # v10: only live sessions from this date count towards the equity
  daily_loss_pct: 40                   # v48 (A-601): 20 % of equity = Rs 1,00,000 at Rs 5L (v44: 22 %)
  daily_loss_limit: 200000             # fallback for capital_mode fixed
  max_open_positions: 4                # v4 (was 2): across underlyings; a straddle is two
  max_lots_per_underlying: 400         # v4 (was 4): capital is the binding limit now
  max_orders_per_minute: 20

sizing:
  max_participation_pct: 2             # v12: an entry or add buys at most 2 % of the premium traded in the last minute
  premium_budget_pct: 100              # v9 (v8: 50): a strategy's budget = its file budget x equity / starting_capital
  rvol_boost_threshold: 1.5            # v17 (A-106, user 15 Oct: "register and test the futures volume sizing"): a single-
  rvol_boost_factor: 1.5               # leg entry is sized at 1.5 x its budget when futures time-of-day RVOL >= 1.5 at entry

time:
  no_new_entries_after: "14:51"      # v54 (A-630): v48 with entries until 14:50
  square_off_at: "15:36"               # v3: hard exit of everything after CAS ends, before the 15:40 close
  cas_entry_window: "15:20-15:30"      # v3: entries allowed here despite no_new_entries_after (CAS mode)

data:
  max_feed_age_sec: 5                  # a stale index or option feed blocks new entries
  max_spread_pct: 1.5                  # entries refused when the option's spread is wider

orders:
  entry_buffer_ticks: 4                # marketable limit: ask + 4 ticks for a buy
  exit_buffer_ticks: 4                 # sell limit: bid − max(4 ticks, exit_buffer_pct)
  exit_buffer_pct: 1.0                 # v2: 1% of the bid, so exits keep up with a falling bid
  entry_slice_depth_pct: 0.5           # v12: child orders no larger than the ask within 0.5 % of the best ask
  entry_slice_max_drift_pct: 2         # v12: stop slicing when the ask is 2 % above the first slice's ask
  entry_timeout_sec: 10                # an unfilled entry is cancelled after this (v12: also ends slicing)
  exit_chase_sec: 2                    # v2 (was 5): an unfilled exit is re-priced at the new touch after this
  exit_chase_max: 6                    # re-pricings before the exit crosses 5% through the touch
  stop_limit_offset_pct: 5             # stop-limit's limit is this far below its trigger
  reconcile_every_sec: 30

shorts:                                # v19 (A-358): PAPER short straddles only
  margin_per_lot: 120000               # rupees one NIFTY straddle lot (a sold call + put) ties up; estimate, see the header
  max_lots: 1                          # the most lots one short entry may sell
priority:                              # v43 (A-475)
  low: [session-break-retest]
  low_keep_free_pct: 50
  # A-476: an entry of any other strategy refused for capital closes low-priority positions (largest first) until
  # the shortfall is covered and is tried again once they are closed (within 60 s); nothing closes if they cannot cover it
  low_preempt: true
