# v21 (A-298, 1 Nov 2026, user: "register and test the per-trade loss cap on tick days"): v17 plus
# sizing.delta_risk_per_trade = Rs 25000 (5 % of Rs 5 L). Each single-leg entry buys at most the premium whose
# first stop loses this much: risk per unit = the smaller of the premium stop (stop % x ask) and |delta| x the index points to
# the strategy's stop at entry (risk v6's rule). It only shrinks an entry; the strategy's budget still caps it. For the
# A-298 replays only: in no live or shadow session.
version: paper-risk-v21
# v4 (2026-09-27, user's decision): the expiry-breakout straddle trades the full ₹5,00,000 as premium.
# The daily loss limit rises from ₹10,000 to ₹1,10,000 (its −20 % combined stop on ₹5,00,000 plus slippage),
# up to 4 open positions (a straddle is two), and up to 400 lots per underlying (a full-capital
# straddle is ~100 lots a leg). Capital itself is now enforced: premium in use + a new entry must fit
# in account.capital, so while the straddle holds the capital other strategies' entries are refused.
# v3 (2026-09-26): for the closing-auction mode of strategy ecr-v4. The square-off moves from 15:20
# to 15:36 (after the auction ends at 15:35, before the 15:40 derivatives close) and new entries are
# allowed again inside the CAS entry window 15:20-15:30. Everything else is unchanged from v2.
name: paper-risk
status: UNCALIBRATED

account:
  capital: 500000                      # the fallback (capital_mode fixed); v8 sizes from equity instead
  capital_mode: equity                 # v8: equity = starting_capital + realised net of finished live sessions
  starting_capital: 500000
  equity_from: "2026-10-07"            # v10: only live sessions from this date count towards the equity
  daily_loss_pct: 22                   # v9 (v8: 15): 22 % of equity = v4's Rs 1,10,000 at Rs 5L
  daily_loss_limit: 110000             # fallback for capital_mode fixed
  max_open_positions: 4                # v4 (was 2): across underlyings; a straddle is two
  max_lots_per_underlying: 400         # v4 (was 4): capital is the binding limit now
  max_orders_per_minute: 20

sizing:
  max_participation_pct: 2             # v12: an entry or add buys at most 2 % of the premium traded in the last minute
  premium_budget_pct: 100              # v9 (v8: 50): a strategy's budget = its file budget x equity / starting_capital
  rvol_boost_threshold: 1.5            # v17 (A-106, user 15 Oct: "register and test the futures volume sizing"): a single-
  rvol_boost_factor: 1.5               # leg entry is sized at 1.5 x its budget when futures time-of-day RVOL >= 1.5 at entry
  delta_risk_per_trade: 25000            # v21 (A-298): rupees lost at the first stop, at most

time:
  no_new_entries_after: "14:45"
  square_off_at: "15:36"               # v3: hard exit of everything after CAS ends, before the 15:40 close
  cas_entry_window: "15:20-15:30"      # v3: entries allowed here despite no_new_entries_after (CAS mode)

data:
  max_feed_age_sec: 5                  # a stale index or option feed blocks new entries
  max_spread_pct: 1.5                  # entries refused when the option's spread is wider

orders:
  entry_buffer_ticks: 4                # marketable limit: ask + 4 ticks for a buy
  exit_buffer_ticks: 4                 # sell limit: bid − max(4 ticks, exit_buffer_pct)
  exit_buffer_pct: 1.0                 # v2: 1% of the bid, so exits keep up with a falling bid
  entry_slice_depth_pct: 0.5           # v12: child orders no larger than the ask within 0.5 % of the best ask
  entry_slice_max_drift_pct: 2         # v12: stop slicing when the ask is 2 % above the first slice's ask
  entry_timeout_sec: 10                # an unfilled entry is cancelled after this (v12: also ends slicing)
  exit_chase_sec: 2                    # v2 (was 5): an unfilled exit is re-priced at the new touch after this
  exit_chase_max: 6                    # re-pricings before the exit crosses 5% through the touch
  stop_limit_offset_pct: 5             # stop-limit's limit is this far below its trigger
  reconcile_every_sec: 30
