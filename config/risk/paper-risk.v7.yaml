# v7 (2026-10-02, RESEARCH ONLY, never live; ledger A-033): paper-risk v4 with the account limits that make
# strategies refuse each other's trades removed, so an unconstrained replay gives every candidate signal
# its own outcome: capital Rs 1,00,00,000 (each strategy still sizes to its own premium budget), no daily
# loss limit in practice, up to 40 open positions. Time, data, order and execution rules are v4's.
# Pre-trade risk limits for PAPER trading. Exits are never blocked by risk; these limits stop new
# entries and adds, and force a square-off.
version: paper-risk-v7
name: paper-risk
status: UNCALIBRATED
account:
  capital: 10000000                    # v7: no capital contention between strategies (research only)
  daily_loss_limit: 100000000          # v7: never engages (research only)
  max_open_positions: 40               # v7 (v4: 4)
  max_lots_per_underlying: 4000        # v7 (v4: 400)
  max_orders_per_minute: 200           # v7 (v4: 20): several strategies may act in one minute
time:
  no_new_entries_after: "14:45"
  square_off_at: "15:36"               # v3: hard exit of everything after CAS ends, before the 15:40 close
  cas_entry_window: "15:20-15:30"      # v3: entries allowed here despite no_new_entries_after (CAS mode)

data:
  max_feed_age_sec: 5                  # a stale index or option feed blocks new entries
  max_spread_pct: 1.5                  # entries refused when the option's spread is wider

orders:
  entry_buffer_ticks: 4                # marketable limit: ask + 4 ticks for a buy
  exit_buffer_ticks: 4                 # sell limit: bid − max(4 ticks, exit_buffer_pct)
  exit_buffer_pct: 1.0                 # v2: 1% of the bid, so exits keep up with a falling bid
  entry_timeout_sec: 10                # an unfilled entry is cancelled after this
  exit_chase_sec: 2                    # v2 (was 5): an unfilled exit is re-priced at the new touch after this
  exit_chase_max: 6                    # re-pricings before the exit crosses 5% through the touch
  stop_limit_offset_pct: 5             # stop-limit's limit is this far below its trigger
  reconcile_every_sec: 30
