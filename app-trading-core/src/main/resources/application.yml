spring:
  config:
    import: optional:file:.env[.properties]
  main:
    banner-mode: off
  web:
    resources:
      static-locations: file:ui/dist/,classpath:/static/   # the React build (npm run build in ui/)
      cache:
        cachecontrol:
          no-cache: true             # browsers revalidate, so a new UI build shows on reload
  datasource:
    url: ${AUTOTRADE_DB_URL:jdbc:postgresql://127.0.0.1:5500/autotrade}
    username: ${AUTOTRADE_DB_USER:autotrade}
    password: ${AUTOTRADE_DB_PASSWORD:autotrade}
    hikari:
      maximum-pool-size: 6
      pool-name: autotrade
  flyway:
    locations: classpath:db/migration

server:
  address: 127.0.0.1             # loopback only until Phase 5 adds authentication
  port: ${AUTOTRADE_TRADING_PORT:8095}

management:
  endpoints:
    web:
      exposure:
        include: health,info

autotrade:
  trading:
    account: PAPER-1
    # BANKNIFTY no longer subscribed or recorded (user's decision 2026-09-29: "ignore the capture of
    # BANKNIFTY for now"); it was recorded, never traded, from 28 Sep. Add it back here to record it.
    underlyings: [NIFTY, SENSEX]
    # Strategies trade only these (user's decision 2026-09-27).
    trade-underlyings: [NIFTY, SENSEX]
    fill-model: base
    strategy-file: config/strategy/early-confirm-runner.v6.yaml   # used only when strategy-files is empty
    # Every strategy runs side by side on the same feed (positions per strategy, risk limits and the
    # ₹5,00,000 capital shared). User's decisions: ebs-v1 (2026-09-27) the expiry breakout straddle with
    # the full capital after 12:30; ecr-v7 / egb-v3 (2026-09-27) = ecr-v6 / egb-v2 sized to ₹5,00,000.
    # Strategies decide in this order on every snapshot, so the straddle is listed first: when it and
    # another strategy trigger together, it takes the capital ("straddle first").
    # egb-v3 removed 2026-09-27 (user: run the strategies behind the replay results; egb-v3 was refused for
    # capital both times it triggered on the 7 expiry days and made no trade).
    strategy-files:
      - config/strategy/expiry-breakout-straddle.v2.yaml   # ebs-v2 = v1 with no limit on straddles a day (user, 2026-10-01)
      - config/strategy/early-confirm-runner.v11.yaml      # ecr-v11 = v8 (expiry days only) with no limit on campaigns per side (user, 2026-10-01)
      - config/strategy/opening-drive.v3.yaml              # odb-v3 = v2 with no limit on trades; a re-entry needs a fresh break (user, 2026-10-01)
      - config/strategy/expiry-gamma-breakout.v4.yaml      # egb-v4 = v3 with no limit on campaigns per side (user, 2026-10-01)
      - config/strategy/expiry-trend-rider.v7.yaml         # etr-v7 live (A-059 PASS, user 2026-10-08 18:30: "swap v1 with v7"; A-060) = etr-v1 + profit lock (breakeven after +30 %); v1 live 2 Oct-8 Oct (A-031)
      # User 2026-10-07 07:00 IST: "run everything in PAPER mode, no need of SHADOW mode" (A-053). The former shadow
      # strategies come after the existing ones, so on a common trigger the existing ones take the capital first.
      - config/strategy/break-retest.v1.yaml               # brt-v1 live (was shadow, A-041); never the expiring index; Rs 2.5L budget
      - config/strategy/expiry-trend-rider.v6.yaml         # etr-v6 live as "expiry-trend-rider@etr-v6" (A-049 PASS; user 2026-10-07 21:05: "swap v5 with the trail"; A-056): v1 + peak trail; same entries as etr-v1, so the two share the capital on a common trigger
    features-file: config/features/features.v11.yaml   # v11 = v7 with the VWAP proxy using the 15-minute mean basis (A-030, user 2026-10-02: "yes switch to v11"); v7 = v6 + ATR seeded from the previous session
    exchange-file: config/exchange/nse-bse-sessions.v3.yaml
    costs-file: config/costs/india-index-options-costs.v2.yaml   # v2: Upstox Plus brokerage Rs 30/order from 2026-09-01 (A-044, user 2026-10-06)
    risk-file: config/risk/paper-risk.v10.yaml   # v10 (A-054, user 2026-10-07 07:15: "start the sizing from 5,00,000 from today"): v9 with equity counted from 7 Oct (Rs 5L + live sessions from that date). v9 (A-047): capital = equity, budgets x equity/5L, daily loss 22 % of equity
    poll-interval-ms: 250
    replay-speed: 0                # --mode=replay only: market seconds per second (e.g. 60); 0 = as fast as possible
    replay-source: zt              # --mode=replay only: zt (zt-tiger-v2's capture), own (auto-trade's live capture, md.*; from 28 Sep 2026) or bars (Upstox one-minute bars in hist.candle; --mode=fetch-bars loads them)
    # replay-equity:               # --mode=replay only: start the replayed day from this equity (bin/replay-chain.sh chains days); absent = starting capital
    # Shadow mode (--mode=auto): after each live session, these candidates replay the day from own capture on
    # account SHADOW-1 (no orders anywhere). Empty since 2026-10-07 (user: "run everything in PAPER mode, no need of
    # SHADOW mode"); --mode=shadow --session=D still runs a list given on the command line.
    shadow-strategy-files: []
    recheck-window-ms: 3000
    start-at: "09:00"              # --mode=auto starts the live session at this IST time on trading days
    stop-after: "15:45"
    feed: upstox                   # upstox (falls back to zt-tail when no token or the feed fails) or zt-tail
  upstox:
    token-source: zt                     # zt: read zt-tiger-v2's Upstox token (read-only); file: own token file only
    token-file: ${UPSTOX_TOKEN_FILE:.local/upstox/token.json}
    instrument-dir: .local/instruments   # NSE-*.json.gz / BSE-*.json.gz contract files (newest used)
    strikes-each-side: 12
    recenter-strikes: 8
  alerts:                                # --mode=auto only (replays never alert)
    telegram-file: .local/telegram/bot.env   # TELEGRAM_BOT_TOKEN=... and TELEGRAM_CHAT_ID=... (never logged); absent = log and UI only
    disk-path: config                    # a bind-mounted host folder: its free space is the Mac's
    disk-warn-gb: 8
    disk-critical-gb: 4
    trades: true                         # a message when a trade opens and closes
    # Surge alerts for manual calls (user, 2026-10-02): futures volume >= surge-min-x × normal with bullish /
    # bearish OI flow (never mixed), 09:20-15:15, one per index and direction per cooldown unless the flow flips or
    # the multiple doubles; a follow-up 15 min later. Defaults from the 28 Sep-1 Oct check: about 4 a day.
    surge-alerts: true
    surge-min-x: 10
    surge-min-volume: { NIFTY: 0, SENSEX: 1000 }   # SENSEX futures are thin: ignore surges on tiny volumes
    surge-cooldown-min: 10
    surge-follow-up: true
  source:
    url: ${ZT_SOURCE_URL:jdbc:postgresql://127.0.0.1:5490/trading}
    username: ${ZT_SOURCE_USER:zerotrade}
    password: ${ZT_SOURCE_PASSWORD:}
    password-file: ${ZT_SOURCE_PASSWORD_FILE:../zt-tiger-v2/.local/v2/runtime.env}
    password-key: V2_DB_PASSWORD

logging:
  level:
    root: WARN
    com.autotrade: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %msg%n"
