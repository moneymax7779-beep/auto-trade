spring:
  config:
    import: optional:file:.env[.properties]
  main:
    banner-mode: off
  web:
    resources:
      static-locations: file:ui/dist/,classpath:/static/   # the React build (npm run build in ui/)
      cache:
        cachecontrol:
          no-cache: true             # browsers revalidate, so a new UI build shows on reload
  datasource:
    url: ${AUTOTRADE_DB_URL:jdbc:postgresql://127.0.0.1:5500/autotrade}
    username: ${AUTOTRADE_DB_USER:autotrade}
    password: ${AUTOTRADE_DB_PASSWORD:autotrade}
    hikari:
      maximum-pool-size: 6
      pool-name: autotrade
  flyway:
    locations: classpath:db/migration

server:
  address: 127.0.0.1             # loopback only until Phase 5 adds authentication
  port: ${AUTOTRADE_TRADING_PORT:8095}
  forward-headers-strategy: framework   # behind nginx / the load balancer: the sign-in redirect uses the public https address
  servlet:
    session:
      cookie:
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

autotrade:
  trading:
    account: PAPER-1
    # BANKNIFTY no longer subscribed or recorded (user's decision 2026-09-29: "ignore the capture of
    # BANKNIFTY for now"); it was recorded, never traded, from 28 Sep. Add it back here to record it.
    # 15 Oct 2026 (A-108, user ~08:29: "Can we deploy these changes BANKNIFTY now on GCP?"; feature/missing-data merged,
    # A-109): BANKNIFTY recorded again, never traded (trade-underlyings below); its move is stored in every candidate's
    # context (peerMovePct.BANKNIFTY).
    underlyings: [NIFTY, SENSEX, BANKNIFTY]
    # Strategies trade only these (user's decision 2026-09-27).
    trade-underlyings: [NIFTY, SENSEX]
    fill-model: base
    strategy-file: config/strategy/early-confirm-runner.v6.yaml   # used only when strategy-files is empty
    # Every strategy runs side by side on the same feed (positions per strategy, risk limits and the
    # ₹5,00,000 capital shared). User's decisions: ebs-v1 (2026-09-27) the expiry breakout straddle with
    # the full capital after 12:30; ecr-v7 / egb-v3 (2026-09-27) = ecr-v6 / egb-v2 sized to ₹5,00,000.
    # Strategies decide in this order on every snapshot, so the straddle is listed first: when it and
    # another strategy trigger together, it takes the capital ("straddle first").
    # egb-v3 removed 2026-09-27 (user: run the strategies behind the replay results; egb-v3 was refused for
    # capital both times it triggered on the 7 expiry days and made no trade).
    strategy-files:
      # ebs-v2 removed 2026-10-23 (A-171, user: "remove ebs from live"): out of sample on Oct 2024-Dec 2025 (A-168) 42 trades
      # -Rs 4,16,679, PF 0.80 (+Rs 3.52L / -Rs 7.69L by half). Its file and code stay; it returns only through a new registered test.
      - config/strategy/early-confirm-runner.v11.yaml      # ecr-v11 = v8 (expiry days only) with no limit on campaigns per side (user, 2026-10-01)
      # odb-v3 removed 2026-10-24 (A-184 PASS, user: "yes remove odb from live and keep it in shadow"): on the 27 tick days the
      # live set without it made +Rs 39.02L vs +Rs 36.16L, win 58 % vs 53 %, better in both halves; odb-v3 alone -Rs 32K (PF 0.91,
      # 10 of 16 trades failed within 3 minutes) and its 14 Oct losses tripped the kill switch that refused mac's 12:54 puts.
      # Bars favour it (+Rs 4.41L on 2024-25) but overstate it (12 days both ways: +Rs 1.97L bars vs +Rs 24K ticks). It now
      # runs as a shadow (below) to keep its forward record.
      # egb-v4 removed 2026-10-15 (A-095 PASS, A-105; user 14 Oct: "choose the best and make the changes"): 0 trades on
      # the 24 tick days, 6 on 169 bar days (1 win, PF 0.17); without it +Rs 75,795 on bar days, tick days unchanged,
      # every other strategy's trades unchanged. Its file and code stay; it returns only through a new registered test.
      - config/strategy/expiry-trend-rider.v1.yaml         # etr-v1 live again from 14 Oct (A-093, user 2026-10-13 ~18:15: "do whatever is needed for best profits"): v7's profit lock sold the 13 Oct NIFTY 0DTE call at breakeven at 14:23 before it ran 30 -> 145 (replay at live equity: +Rs 10.59L held to 15:15); never better than v1 on the 23 tick days. v7 live 9-13 Oct (A-060); v1 live 2-8 Oct (A-031)
      # User 2026-10-07 07:00 IST: "run everything in PAPER mode, no need of SHADOW mode" (A-053). The former shadow
      # strategies come after the existing ones, so on a common trigger the existing ones take the capital first.
      # brt-v1 removed 2026-10-11 (A-075, user: "remove break retest"): 60 tick trades, PF 0.81, losing on held-out and
      # unseen days; removing it measured +Rs 76,835 over 22 tick days with every other strategy's trades unchanged (A-074).
      # Its file and code stay; it returns only through a new registered test.
      - config/strategy/ma-cross.v1.yaml                   # mac-v1 forward test in PAPER (A-067, user 2026-10-09 20:40: "run it in paper"); A-066 test PASS, held-out FAIL on one trade; never the expiring index; Rs 2.5L budget; last, so the others take the capital first
      - config/strategy/opening-drive-momentum.v4.yaml     # odm-v4 live from 14 Oct (A-093) = odm-v3 (A-089) + peak trail (arm +50 %, exit 15 % off the peak; A-091 PASS, thin): never worse than v3 on 23 tick days (+Rs 1.55L), 13 Oct +Rs 35K; last, so the others take the capital first
      # zbf-v10 removed 2026-10-19 after one live session (A-149, user 19 Oct ~16:50: "remove zbf-v10 from the live set"):
      # live 19 Oct only (A-148), 3 trades, 3 losses, -Rs 1,49,446 (the set's day -Rs 1,16,673; without it +Rs 32,774).
      # Its file and code stay; it returns only through a new registered test.
    features-file: config/features/features.v12.yaml   # v12 from 14 Oct (A-090 PASS, A-093): v11 + bar backfill of spot history, weekly/monthly levels, OI-change z-scores; no trade changed on 23 tick days. v11 (A-030) live 2-13 Oct
    exchange-file: config/exchange/nse-bse-sessions.v3.yaml
    costs-file: config/costs/india-index-options-costs.v2.yaml   # v2: Upstox Plus brokerage Rs 30/order from 2026-09-01 (A-044, user 2026-10-06)
    risk-file: config/risk/paper-risk.v17.yaml   # v17 from 15 Oct (A-106 PASS thin, A-107; user 15 Oct ~08:00: "deploy v17"): v12 + a single-leg entry at up to 1.5 x its budget when futures RVOL >= 1.5 at entry, using spare capital only (+Rs 66K over 193 days, worst day unchanged; review after 10 sessions). # v12 (A-063, user 2026-10-09 00:19: "switch to v12 and deploy before 09:00"): v10 + entries sliced to the visible book (0.5 % of the ask, 2 % drift, 10 s) + 2 % participation cap (A-062). v10 (A-054, user 2026-10-07 07:15: "start the sizing from 5,00,000 from today"): v9 with equity counted from 7 Oct (Rs 5L + live sessions from that date). v9 (A-047): capital = equity, budgets x equity/5L, daily loss 22 % of equity
    poll-interval-ms: 250
    replay-speed: 0                # --mode=replay only: market seconds per second (e.g. 60); 0 = as fast as possible
    replay-source: zt              # --mode=replay only: zt (zt-tiger-v2's capture), own (auto-trade's live capture, md.*; from 28 Sep 2026) or bars (Upstox one-minute bars in hist.candle; --mode=fetch-bars loads them)
    # replay-equity:               # --mode=replay only: start the replayed day from this equity (bin/replay-chain.sh chains days); absent = starting capital
    # replay-snapshots: true       # --mode=replay only: also store every feature snapshot (run kind REPLAY_FEATURES; research dataset, A-094); absent = off
    # Shadow mode (--mode=auto): after each live session, these candidates replay the day from own capture on
    # account SHADOW-1 (no orders anywhere). Empty since 2026-10-07 (user: "run everything in PAPER mode, no need of
    # SHADOW mode"); --mode=shadow --session=D still runs a list given on the command line.
    # 2026-10-12 (A-077, user: "yes set orc-v1 up in shadow"): opening-range continuation runs in shadow only, after
    # each live session, on SHADOW-1 (no capital shared with the live set), until it has 15-20 new days to judge.
    # 2026-10-12 (A-078, user: "make orc-v2 that can enter before 10:15"): v2 joins v1, each in its own shadow session.
    shadow-strategy-files:
      - config/strategy/opening-range-continuation.v1.yaml
      - config/strategy/opening-range-continuation.v2.yaml
      # 2026-10-12 (A-083, user: "put orb-v1 in shadow and test the capital reserve"): the 15-minute ORB, own session.
      - config/strategy/opening-range-breakout.v1.yaml
      # 2026-10-12 23:40 (A-086, user: "yes we can put odm-v1 in shadow mode"): opening drive momentum, own session.
      - config/strategy/opening-drive-momentum.v1.yaml
      # 2026-10-12 23:55 (A-087 IV filter, A-088 breadth filter; user: "yes register both filter tests and run in shadow")
      - config/strategy/opening-drive-momentum.v2.yaml
      - config/strategy/opening-drive-momentum.v3.yaml
      - config/strategy/opening-range-breakout.v2.yaml
      - config/strategy/opening-range-breakout.v3.yaml
      # 2026-10-13 (A-093): odm-v5, the opening drive also on the expiring index (A-092 INCONCLUSIVE: no extra trade on 23
      # tick days; 13 Oct would have taken the NIFTY 0DTE call +Rs 2.50L); odm-v3 stays in shadow (odm-v4 is live).
      - config/strategy/opening-drive-momentum.v5.yaml
      # 2026-10-15 ~23:55 (A-114, user: "yes register A-114 and put odb-v9 in shadow"): odb-v3 + the 10:00 exit extended
      # to 15:15 only with futures RVOL >= 1 and the future on the trade's side of VWAP; own session, judged forward.
      - config/strategy/opening-drive.v9.yaml
      # 2026-10-24 (A-184, user: "keep it in shadow"): odb-v3 after it left the live set; own session, judged forward.
      - config/strategy/opening-drive.v3.yaml
      # 2026-10-19 ~19:00 (A-150, user: "add zbf-v10 as a shadow"): zbf-v10 after it left the live set (A-149); own session,
      # no capital shared with the live set, judged forward.
      - config/strategy/zone-break-flow.v10.yaml
      # 2026-10-21 ~22:45 (A-158, user: "yes register and build it and run in shadow"): the ATM OI burst (A-157's 3-minute
      # near-ATM OI burst with futures volume); ~23:00 (A-159, user: "Choose - Premium trail"): aob-v2, premium-trail exit,
      # replaces aob-v1 (opposite-burst exit) before v1 ever ran; own session.
      - config/strategy/atm-oi-burst.v2.yaml
      # 2026-10-22 ~00:55 (A-161, user: "yes add v4 to shadow alongside v2"): aob-v4 = aob-v2 + the OI climax exit; own
      # session, same entries as v2, so the two compare the exit alone on new days.
      - config/strategy/atm-oi-burst.v4.yaml
      # 2026-10-23 (A-172 PASS, user: "yes build odm-v9"): odm-v4 + the fresh-drive rule; own session, judged against
      # odm-v4 (live) on the same days before any live change.
      - config/strategy/opening-drive-momentum.v9.yaml
      # 2026-10-23 (A-179, user: "put covering-only aob variant and run replay"): aob-v5 = aob-v2 entering only on covering
      # bursts (A-178: covering +6.2 bp vs writing +1.5 bp on 17 tick days, CI includes zero); own session, judged forward.
      - config/strategy/atm-oi-burst.v5.yaml
    recheck-window-ms: 3000
    start-at: "09:00"              # --mode=auto starts the live session at this IST time on trading days
    stop-after: "15:45"
    feed: upstox                   # upstox (falls back to zt-tail when no token or the feed fails) or zt-tail
  upstox:
    token-source: zt                     # zt: read zt-tiger-v2's Upstox token (read-only); file: own token file only
    token-file: ${UPSTOX_TOKEN_FILE:.local/upstox/token.json}
    instrument-dir: .local/instruments   # NSE-*.json.gz / BSE-*.json.gz contract files (newest used)
    # 20 from 2026-10-24 (A-197, user: "widen strikes to 20"): the weekly short strangle's ~Rs 30 picks sit up to ~1,000 NIFTY
    # points from ATM; at 12 (+-600 points) one of three checked entries was on the range edge. ~+64 % option ticks.
    strikes-each-side: 20
    recenter-strikes: 8
  alerts:                                # --mode=auto only (replays never alert)
    telegram-file: .local/telegram/bot.env   # TELEGRAM_BOT_TOKEN=... and TELEGRAM_CHAT_ID=... (never logged); absent = log and UI only
    disk-path: config                    # a bind-mounted host folder: its free space is the Mac's
    disk-warn-gb: 8
    disk-critical-gb: 4
    trades: true                         # a message when a trade opens and closes
    # Surge alerts for manual calls (user, 2026-10-02): futures volume >= surge-min-x × normal with bullish /
    # bearish OI flow (never mixed), 09:20-15:15, one per index and direction per cooldown unless the flow flips or
    # the multiple doubles; a follow-up 15 min later. Defaults from the 28 Sep-1 Oct check: about 4 a day.
    surge-alerts: true
    surge-min-x: 10
    surge-min-volume: { NIFTY: 0, SENSEX: 1000 }   # SENSEX futures are thin: ignore surges on tiny volumes
    surge-cooldown-min: 10
    surge-follow-up: true
  # feature/missing-data: pre-open and positioning cues (GIFT Nifty from NSE IX, NSE participant-wise OI), collected in
  # the background in --mode=auto / serve only. Off unless set (env AUTOTRADE_CUES_ENABLED=true); the features file
  # v13 reads what is collected. One-shot: --mode=fetch-cues, --mode=fetch-participant-oi --from=D --to=D.
  cues:
    enabled: true                  # A-109 (user 15 Oct ~08:31: ship the whole branch): collect from 15 Oct; features stay v12
    gift-poll-minutes: 5
  # Per-user logins (L3, user 24 Oct 2026: "start per-user logins with Keycloak"). none = no login in the app (as before);
  # oidc = Keycloak sign-in on every page and API, the signed-in user acts on the execution API, the realm role
  # "operator" may use kill / stop / exit-all. Realm, client and roles: bin/keycloak/bootstrap.sh.
  auth:
    mode: ${AUTOTRADE_AUTH_MODE:none}
    public-base: ${AUTOTRADE_AUTH_PUBLIC_BASE:}         # Keycloak as the browser reaches it, e.g. http://localhost:8180/auth
    internal-base: ${AUTOTRADE_AUTH_INTERNAL_BASE:}     # as this service reaches it (default: public-base)
    realm: autotrade
    client-id: autotrade-web
    client-secret: ${AUTOTRADE_AUTH_CLIENT_SECRET:}     # from the environment only, never in a file in the repo
    operator-role: operator
  source:
    url: ${ZT_SOURCE_URL:jdbc:postgresql://127.0.0.1:5490/trading}
    username: ${ZT_SOURCE_USER:zerotrade}
    password: ${ZT_SOURCE_PASSWORD:}
    password-file: ${ZT_SOURCE_PASSWORD_FILE:../zt-tiger-v2/.local/v2/runtime.env}
    password-key: V2_DB_PASSWORD

logging:
  level:
    root: WARN
    com.autotrade: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %msg%n"
