# Execution workers (live execution L1). Reads and writes acct.* / exec.*; reads trade.* (the signal session's fills,
# replay depth) and md.option_tick (retry quotes). Never migrates the schema (trading-core does) and never opens a
# market-data connection.
spring:
  application:
    name: autotrade-execution
  web:
    error:
      include-message: always         # a refusal's reason ("read-only role for this account") reaches the UI
  datasource:
    url: ${AUTOTRADE_DB_URL:jdbc:postgresql://127.0.0.1:5500/autotrade}
    username: ${AUTOTRADE_DB_USER:autotrade}
    password: ${AUTOTRADE_DB_PASSWORD:autotrade}
    hikari:
      maximum-pool-size: 13           # one held connection per leased account + the loop's own + SignalWakeup's LISTEN
      pool-name: execution
  flyway:
    enabled: false
  task:
    scheduling:
      pool:
        size: 4                       # the follower tick, the Kite session sweep and the 08:30 Telegram never wait on each other

server:
  address: 127.0.0.1
  port: ${AUTOTRADE_EXECUTION_PORT:8096}

management:
  endpoints:
    web:
      exposure:
        include: health,info

autotrade:
  execution:
    tenant: owner
    copy-group: LIVE-SET
    poll-ms: 1000
    wake-on-signal: true            # a stored signal decision runs the tick at once (Postgres LISTEN); the poll is the fallback
    costs-file: config/costs/india-index-options-costs.v2.yaml
    # Holidays for the 08:30 login links and the 09:10 login board. Keep equal to trading-core's
    # autotrade.trading.exchange-file: a new exchange file version is changed in both places.
    exchange-file: config/exchange/nse-bse-sessions.v3.yaml
    broker-funds: 1000000000         # DRY_RUN in L1: simulated broker funds (L2 reads the broker)
    # READ_LIVE probe (code review 8 Nov 2026): a Kotak / Upstox / Groww DRY_RUN route on dry_run_market BROKER reads the
    # real session's orders, trades and positions at its open and every `every` (ISO-8601; blank = off), audits a
    # READ_LIVE_PROBE row per account, and saves the answers redacted (no token, sid or keys) under `dir` (blank = none)
    # as material for contract tests. Reads only; a failure never affects trading.
    read-live-probe:
      every: ${AUTOTRADE_READ_LIVE_PROBE_EVERY:PT5M}
      dir: ${AUTOTRADE_READ_LIVE_PROBE_DIR:/app/broker-sessions/read-live-probes}
      # Idle accounts (a DAILY_SWITCH member's real account on a PAPER day) that keep a READ_LIVE probe while they have
      # today's login: account ids, comma-separated; blank = none. Reads only, never an order (user 8 Nov 2026).
      accounts: ${AUTOTRADE_READ_LIVE_PROBE_ACCOUNTS:}
    # The daily Kite login (live L3, user go-ahead 24 Oct 2026): the app's key and secret as files in secrets-dir (read
    # only; the credential profile names them file:<name>), the day's access token per account in sessions-dir (owner
    # only), the 08:30 IST login link by Telegram to public-base-url/api/execution/accounts/{id}/kite/login.
    kite:
      secrets-dir: ${AUTOTRADE_KITE_SECRETS_DIR:/app/secrets}
      sessions-dir: ${AUTOTRADE_KITE_SESSIONS_DIR:/app/broker-sessions}
      public-base-url: ${AUTOTRADE_PUBLIC_BASE_URL:}
      api-base: ${AUTOTRADE_KITE_API_BASE:https://api.kite.trade}
      login-base: ${AUTOTRADE_KITE_LOGIN_BASE:https://kite.zerodha.com}
      telegram-file: ${AUTOTRADE_TELEGRAM_FILE:/app/telegram/bot.env}
    # Family members' Keycloak logins (trader workspaces, 7 Nov 2026): the autotrade-admin service account on the realm's
    # internal address (bin/keycloak/bootstrap.sh --admin-secret-file); blank url or secret = members' logins stay a
    # console job. The secret comes from the VM's root-only .env, never this file.
    keycloak:
      url: ${AUTOTRADE_EXECUTION_KEYCLOAK_URL:}
      realm: ${AUTOTRADE_EXECUTION_KEYCLOAK_REALM:autotrade}
      client-id: ${AUTOTRADE_EXECUTION_KEYCLOAK_CLIENT_ID:autotrade-admin}
      client-secret: ${AUTOTRADE_EXECUTION_KEYCLOAK_CLIENT_SECRET:}

  # Never zt-tiger-v2's Upstox app or Upstox user (review 8 Nov 2026): a login of zt's app ends zt's token, and a static IP
  # registered for zt's user logs zt out. Refused when an app key is saved, at the Upstox login and when the worker reads a
  # session. Comma-separated, case-insensitive. BM6462 is the user zt-tiger-v2 reads its token for (26 Sep 2026); zt's app
  # key is not in this repo: set AUTOTRADE_UPSTOX_DENIED_API_KEYS on the host.
  brokers:
    upstox:
      denied-api-keys: ${AUTOTRADE_UPSTOX_DENIED_API_KEYS:}
      denied-user-ids: ${AUTOTRADE_UPSTOX_DENIED_USER_IDS:BM6462}
