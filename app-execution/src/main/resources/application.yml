# Execution workers (live execution L1). Reads and writes acct.* / exec.*; reads trade.* (the signal session's fills,
# replay depth) and md.option_tick (retry quotes). Never migrates the schema (trading-core does) and never opens a
# market-data connection.
spring:
  application:
    name: autotrade-execution
  web:
    error:
      include-message: always         # a refusal's reason ("read-only role for this account") reaches the UI
  datasource:
    url: ${AUTOTRADE_DB_URL:jdbc:postgresql://127.0.0.1:5500/autotrade}
    username: ${AUTOTRADE_DB_USER:autotrade}
    password: ${AUTOTRADE_DB_PASSWORD:autotrade}
    hikari:
      maximum-pool-size: 12           # one held connection per leased account + the loop's own
      pool-name: execution
  flyway:
    enabled: false

server:
  address: 127.0.0.1
  port: ${AUTOTRADE_EXECUTION_PORT:8096}

management:
  endpoints:
    web:
      exposure:
        include: health,info

autotrade:
  execution:
    tenant: owner
    copy-group: LIVE-SET
    poll-ms: 1000
    costs-file: config/costs/india-index-options-costs.v2.yaml
    broker-funds: 1000000000         # DRY_RUN in L1: simulated broker funds (L2 reads the broker)
    # The daily Kite login (live L3, user go-ahead 24 Oct 2026): the app's key and secret as files in secrets-dir (read
    # only; the credential profile names them file:<name>), the day's access token per account in sessions-dir (owner
    # only), the 08:30 IST login link by Telegram to public-base-url/api/execution/accounts/{id}/kite/login.
    kite:
      secrets-dir: ${AUTOTRADE_KITE_SECRETS_DIR:/app/secrets}
      sessions-dir: ${AUTOTRADE_KITE_SESSIONS_DIR:/app/broker-sessions}
      public-base-url: ${AUTOTRADE_PUBLIC_BASE_URL:}
      api-base: ${AUTOTRADE_KITE_API_BASE:https://api.kite.trade}
      login-base: ${AUTOTRADE_KITE_LOGIN_BASE:https://kite.zerodha.com}
      telegram-file: ${AUTOTRADE_TELEGRAM_FILE:/app/telegram/bot.env}
