# GCP host (zt-autotrade VM) overrides, used with: docker compose -f docker-compose.yml -f docker-compose.gcp.yml ...
# The Mac setup (docker-compose.yml alone) is unchanged.
# - zt-tiger-v2 runs on the zt-v2 VM: read it over the private network as the read-only autotrade_reader role
#   (password from Secret Manager v2-autotrade-reader, written to .local/zt-source.env as V2_DB_PASSWORD=...).
# - The Upstox token is read from zt-tiger-v2 (token-source zt, the default): autotrade_reader has SELECT on only the
#   seven trading_accounts columns ZtTigerTokenSource queries (granted 3 Oct 2026 by the operator).
# - trading-core stays on 127.0.0.1:8095; host nginx (:8081, password gate) is the only way in, via the HTTPS
#   load balancer.
services:
  trading-core:
    environment:
      ZT_SOURCE_URL: jdbc:postgresql://10.20.0.10:5490/trading
      ZT_SOURCE_USER: autotrade_reader
      ZT_SOURCE_PASSWORD_FILE: /run/zt/runtime.env
      # Live execution (user go-ahead 24 Oct 2026, "C2"): the copy group's signal source runs next to PAPER-1 on a tee of
      # the live feed (PAPER-1 unchanged; a slow signal branch fails alone), recording exec.signal_decision; the UI's
      # Accounts page reaches the execution worker through /api/execution.
      AUTOTRADE_SIGNALSOURCE_ENABLED: "true"
      AUTOTRADE_UI_EXECUTION_URL: http://execution:8096
    volumes:
      - ./.local/zt-source.env:/run/zt/runtime.env:ro

  # The execution worker (profile "execution"): PAPER and DRY_RUN followers only, LIVE refused by the broker registry.
  # The Kite app's key and secret: KITE_API_KEY / KITE_API_SECRET in the VM's root-only .env (user's choice 24 Oct 2026;
  # the credential profile references env:KITE_API_KEY / env:KITE_API_SECRET), passed to this container only; files in
  # .local/kite-secrets remain possible (file:<name>). The day's access tokens go to .local/broker-sessions (uid 10001,
  # mode 700). Telegram: .local/telegram (bot.env).
  execution:
    environment:
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}
      AUTOTRADE_EXECUTION_COPY_GROUP: LIVE-SET
      AUTOTRADE_PUBLIC_BASE_URL: https://autotrade.136-82-45-194.sslip.io
    volumes:
      - ./.local/kite-secrets:/app/secrets:ro
      - ./.local/broker-sessions:/app/broker-sessions
      - ./.local/telegram:/app/telegram:ro

  # Per-user logins (L3; user 29 Oct 2026: "commit and deploy to GCP with keycloak tonight"): Keycloak in production
  # mode on its own database (keycloak) in autotrade-postgres, on 127.0.0.1:8180 only; host nginx routes /auth/ to it
  # behind the HTTPS load balancer. KC_DB_PASSWORD and KC_BOOTSTRAP_ADMIN_PASSWORD are in the VM's root-only .env.
  # Start: docker compose -f docker-compose.yml -f docker-compose.gcp.yml --profile platform up -d keycloak
  keycloak:
    command: ["start"]
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set in .env}
      KC_HOSTNAME: https://autotrade.136-82-45-194.sslip.io/auth
      # The admin console only at the VM's own address, reached through an SSH tunnel (user 29 Oct 2026, option 1:
      # the site's password gate stays on everything; the console's bearer tokens clash with that gate anyway):
      #   gcloud compute ssh zt-autotrade ... -- -N -L 8188:127.0.0.1:8180   then http://localhost:8188/auth/admin/
      #   (8188 on the Mac: its own local Keycloak has 8180)
      KC_HOSTNAME_ADMIN: http://localhost:8188/auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
